[package]
name = "codetrail-desktop"
version = "0.3.2"
description = "Read-only feature-oriented code reader"
authors = ["CodeTrail contributors"]
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[lib]
name = "codetrail_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
reader-core = { path = "../crates/reader-core" }
serde = { version = "1", features = ["derive"] }

anyhow = "1"
serde_json = "1"
