[package]
name = "reader-core"
version = "0.3.0"
edition = "2021"
description = "Read-only repository indexing and version-aware feature annotations"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
anyhow = "1.0"
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "2.7"
tree-sitter = "0.25.10"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.0"
tree-sitter-typescript = "0.23.2"
uuid = { version = "1.0", features = ["v4"] }
tempfile = "3.20"

reader-collab = { path = "../reader-collab" }
